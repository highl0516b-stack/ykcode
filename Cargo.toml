[package]
name = "zero-code-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
leptos = { version = "0.8", features = [] }
leptos_meta = { version = "0.8", features = [] }
leptos_router = { version = "0.8" }
leptos-use = { version = "0.19", default-features = false, features = [
    "use_draggable",
    "use_drop_zone",
    "use_resize_observer",
    "use_element_bounding",
    "use_mouse",
    "use_scroll",
    "use_media_query",
    "use_event_listener",
    "use_window_size",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
tracing = "0.1"
console_error_panic_hook = { version = "0.1.7", optional = true }

# SSR-only deps
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"], optional = true }
leptos_axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "trace"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Hydrate-only deps
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "MouseEvent",
    "TouchEvent",
    "Touch",
    "TouchList",
    "PointerEvent",
    "DragEvent",
    "DataTransfer",
    "DomRect",
    "CssStyleDeclaration",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Performance",
    "Storage",
    "console",
], optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:js-sys",
    "dep:getrandom",
    "dep:console_error_panic_hook",
]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_meta/ssr",
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing-subscriber",
]

[package.metadata.leptos]
output-name = "zero-code-platform"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = ["ssr"]
lib-features = ["hydrate"]

[profile.release]
opt-level = "z"
lto = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
