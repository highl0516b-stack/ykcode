[workspace]
resolver = "2"
members = ["app", "server", "shared"]

[workspace.package]
edition      = "2021"
rust-version = "1.88"
version      = "0.1.0"
authors      = ["ykcode contributors"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/highl0516b-stack/ykcode"

# ── Release profiles ─────────────────────────────────────────────────────────
[profile.release]
codegen-units = 1
lto           = true
opt-level     = "z"

[profile.wasm-release]
inherits      = "release"
opt-level     = "z"
lto           = true
codegen-units = 1

# ── Shared dependency versions ────────────────────────────────────────────────
[workspace.dependencies]

# Leptos 0.8.x ecosystem
leptos       = { version = "0.8.20", default-features = false }
leptos_router = { version = "0.8.14", default-features = false }
leptos_meta  = { version = "0.8.6",  default-features = false }
leptos_axum  = { version = "0.8.10", default-features = false }
server_fn    = { version = "0.8.13", default-features = false }

# HTTP / async
axum = { version = "0.8.9", default-features = false, features = [
    "http1", "json", "matched-path", "original-uri", "query", "tokio", "form",
] }
tokio = { version = "1.52.3", features = [
    "rt-multi-thread", "macros", "signal", "sync", "time", "fs", "io-util", "net",
] }
tower      = { version = "0.5.3", features = ["util", "timeout", "load-shed"] }
tower-http = { version = "0.7.0", features = [
    "cors", "compression-gzip", "trace", "fs", "set-header",
] }
http       = "1.4.2"

# Serialization & errors
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror  = "2.0.18"
anyhow     = "1.0.103"

# Domain types
uuid   = { version = "1.23.4", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde", "clock"], default-features = false }

# Storage layer (optional; activated via features in server crate)
sqlx     = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio", "sqlite", "chrono", "uuid", "macros",
] }
rusqlite = { version = "0.40.1", features = ["bundled", "chrono", "uuid"] }
fjall    = { version = "3.1.6",  default-features = false, features = ["lz4"] }

# Wasm / browser bindings
wasm-bindgen         = "0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys               = "0.3.103"
web-sys = { version = "0.3.103", features = [
    "console", "Document", "Element", "Event", "EventTarget",
    "HtmlElement", "Node", "Window",
    "MouseEvent", "TouchEvent", "DragEvent", "DataTransfer",
    "DomRect", "CssStyleDeclaration", "HtmlCollection",
    "Storage", "Request", "RequestInit", "RequestMode",
    "Response", "Headers", "PointerEvent",
] }

# Observability
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Utilities
cfg-if                  = "1.0.4"
console_error_panic_hook = "0.1.7"
console_log             = "1.0.0"
log                     = "0.4.33"

# Internal crates
shared = { path = "shared" }
app    = { path = "app" }

# ── cargo-leptos workspace project ────────────────────────────────────────────
[[workspace.metadata.leptos]]
name            = "ykcode"
output-name     = "ykcode"
bin-package     = "server"
lib-package     = "app"
site-root       = "target/site"
site-pkg-dir    = "pkg"
style-file      = "style/main.scss"
assets-dir      = "public"
site-addr       = "127.0.0.1:3000"
reload-port     = 3001
browserquery    = "defaults"
watch           = false
env             = "DEV"
bin-features    = ["ssr"]
lib-features    = ["hydrate"]
bin-default-features = false
lib-default-features = false
