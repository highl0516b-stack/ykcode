trunk-version = ">=0.21"

[build]
target = "index.html"
dist = "dist"
public_url = "/"
filehash = true
minify = "on_release"

[watch]
watch = ["src", "style", "public"]
ignore = ["dist", "target"]

[serve]
addresses = ["0.0.0.0"]
port = 8080
open = false
no_spa = false

[tools]
wasm_bindgen = "0.2.126"
wasm_opt = "version_123"

[[proxy]]
backend = "http://localhost:3000/api/"
rewrite = "/api/"
