[package]
name         = "server"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
description  = "ykcode Axum backend API and Leptos SSR host"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
app    = { workspace = true, features = ["ssr"] }
shared.workspace = true

leptos      = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true, features = ["default"] }

axum.workspace         = true
tokio.workspace        = true
tower.workspace        = true
tower-http.workspace   = true
http.workspace         = true

serde.workspace        = true
serde_json.workspace   = true
thiserror.workspace    = true
anyhow.workspace       = true
uuid.workspace         = true
chrono.workspace       = true

tracing.workspace            = true
tracing-subscriber.workspace = true
log.workspace                = true

# Storage — optional on first iteration; enable via features
sqlx  = { workspace = true, optional = true }
fjall = { workspace = true, optional = true }

[features]
default = []
# Enable to activate full storage layer
storage = ["dep:sqlx", "dep:fjall"]
